name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to verify
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.1
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
      - run: node --test .github/scripts/*.test.cjs
      - name: Install sqlc v1.31.1
        run: |
          curl -fsSL https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz -o /tmp/sqlc.tar.gz
          echo '497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz' | sha256sum -c -
          mkdir -p /tmp/sqlc-bin
          tar -xzf /tmp/sqlc.tar.gz -C /tmp/sqlc-bin sqlc
          echo /tmp/sqlc-bin >> "$GITHUB_PATH"
      - name: Verify generated SQLite queries
        run: |
          sqlc generate
          git status --porcelain -- internal/sqlite/generated > /tmp/sqlc-status
          test ! -s /tmp/sqlc-status
      - run: bun ci
        working-directory: web
      - run: bun run test
        working-directory: web
      - run: bun run typecheck
        working-directory: web
      - run: bun run build
        working-directory: web
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go test ./internal/monitoring
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/porty-nocgo ./cmd/porty
      - run: go vet ./...
      - run: go build -trimpath -o /tmp/porty-e2e ./cmd/porty
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      - run: PORTY_E2E_BINARY=/tmp/porty-e2e bun run test:e2e
        working-directory: web
      - run: ./deploy/package_test.sh
      - run: PORTY_LIVE_DOCKER_CHECK=1 ./deploy/package_test.sh
