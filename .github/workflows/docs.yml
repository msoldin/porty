name: documentation
on:
  push:
    branches: [main]
    paths:
      [
        "docs/**",
        "README.md",
        "AGENTS.md",
        "deploy/porty.example.yaml",
        ".github/workflows/docs.yml",
        ".github/scripts/docs-policy*",
        ".github/scripts/release-policy*",
      ]
  pull_request:
    paths:
      [
        "docs/**",
        "README.md",
        "AGENTS.md",
        "deploy/porty.example.yaml",
        ".github/workflows/docs.yml",
        ".github/scripts/docs-policy*",
        ".github/scripts/release-policy*",
      ]
  workflow_dispatch:
  workflow_run:
    workflows: [release]
    types: [completed]
permissions:
  contents: read
# Serialize the complete build/deploy so an older build cannot replace a newer
# release's site. PR checks have their own groups and never deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main') && 'main' || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun ci
        working-directory: docs
      - run: bun run test:unit
        working-directory: docs
      - run: bun run test:build
        working-directory: docs
      - run: node --test .github/scripts/docs-policy.test.cjs
      - name: Select newest published stable documentation
        id: stable
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const {selectStableTag} = require('./.github/scripts/docs-policy.cjs');
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            core.setOutput('tag', selectStableTag(releases));
      - run: bun run build
        working-directory: docs
        env:
          PORTY_DOCS_STABLE_TAG: ${{ steps.stable.outputs.tag }}
      - run: bunx playwright install --with-deps chromium
        working-directory: docs
      - run: bun run test:site
        working-directory: docs
        env:
          PORTY_DOCS_TEST_OUTPUT: "${{ runner.temp }}/porty-docs-tests"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments README.md docs/*.md
          fail: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: documentation-browser-evidence
          path: "${{ runner.temp }}/porty-docs-tests"
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.vitepress/dist
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
